name: "Bug report"
description: "不具合を報告する"
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: "不具合の概要"
      description: "何が起きているかを簡潔に記載してください。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "再現手順"
      placeholder: |
        1. ...を開く
        2. ...を選択する
        3. ...が発生する
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期待する動作"
      description: "本来どう動いてほしいかを記載してください。"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "環境（任意）"
      placeholder: "OS、ブラウザ、バージョンなど"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: "ログ・画像・関連Issue（任意）"
      description: "必要に応じてスクリーンショットやログを添付してください。秘密情報は含めないでください。"
    validations:
      required: false
