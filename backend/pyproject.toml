[project]
name = "slide-library-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.164.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
