services:
  api:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./data:/data
    expose:
      - "8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  web_node_modules:
